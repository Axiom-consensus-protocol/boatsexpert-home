<!-- =========== LIGHTBOX =========== -->
<div class="lbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="lb-top">
      <div class="lb-meta">
        <span class="badge">Finval · 470 EVO DC</span>
        <span class="title">Aluminium Pro Angler · <em>2026</em></span>
      </div>
      <span class="lb-counter"><b id="lb-cur">1</b><span>/</span><span id="lb-total">6</span></span>
      <button class="lb-close" id="lb-close" aria-label="Close photo viewer">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3 L15 15 M15 3 L3 15"/></svg>
      </button>
    </div>
    <div class="lb-stage">
      <button class="lb-prev" id="lb-prev" aria-label="Previous photo">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4 L7 11 L14 18"/></svg>
      </button>
      <img id="lb-img" src="" alt=""/>
      <button class="lb-next" id="lb-next" aria-label="Next photo">
        <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4 L15 11 L8 18"/></svg>
      </button>
    </div>
    <div class="lb-foot">
      <div class="lb-thumbs" id="lb-thumbs"></div>
    </div>
  </div>
