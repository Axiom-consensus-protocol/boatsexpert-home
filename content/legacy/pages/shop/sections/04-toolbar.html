<!-- TOOLBAR -->
<div class="toolbar">
    <div class="container">
      <div class="tb-left">
        <div class="results-count">Showing <b>1 – 12</b> of <b>942</b> products</div>
        <div class="search-input">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="M11 11 L14 14"/></svg>
          <input type="text" placeholder="Search outboards, sonars, batteries…" />
        </div>
      </div>
      <div class="tb-right">
        <div class="sort-wrap">
          <span data-i18n="shop.toolbar.sortby">Sort by</span>
          <select>
            <option>Default sorting</option>
            <option>Popularity</option>
            <option>Average rating</option>
            <option>Latest</option>
            <option>Price: low to high</option>
            <option>Price: high to low</option>
          </select>
        </div>
        <div class="view-toggle">
          <button class="active" aria-label="Grid"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="2" y="2" width="5" height="5" rx=".5"/><rect x="9" y="2" width="5" height="5" rx=".5"/><rect x="2" y="9" width="5" height="5" rx=".5"/><rect x="9" y="9" width="5" height="5" rx=".5"/></svg></button>
          <button aria-label="List"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="3" cy="4" r=".7" fill="currentColor"/><circle cx="3" cy="8" r=".7" fill="currentColor"/><circle cx="3" cy="12" r=".7" fill="currentColor"/><line x1="6" y1="4" x2="14" y2="4"/><line x1="6" y1="8" x2="14" y2="8"/><line x1="6" y1="12" x2="14" y2="12"/></svg></button>
        </div>
      </div>
    </div>
  </div>
