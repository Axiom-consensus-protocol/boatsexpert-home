<!-- =========== TOOLBAR =========== -->
<div class="toolbar">
    <div class="container">
      <div class="toolbar-left">
        <div class="results-count">20 Results of <b>324</b></div>
        <div class="active-chips">
          <span class="chip">Brand: <b>All</b><span class="x"></span></span>
          <span class="chip">Hull: <b>All</b><span class="x"></span></span>
          <button class="chip-clear" data-i18n="catalog.toolbar.clear">Clear all</button>
        </div>
      </div>
      <div class="toolbar-right">
        <div class="sort-wrap">
          <span data-i18n="catalog.toolbar.sortby">Sort by</span>
          <select>
          <option>New First</option>
          <option>Old First</option>
          <option>Price · low to high</option>
          <option>Price · high to low</option>
          </select>
        </div>
        <div class="view-toggle">
          <button class="active" aria-label="Grid view">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="2" y="2" width="5" height="5" rx=".5"/><rect x="9" y="2" width="5" height="5" rx=".5"/><rect x="2" y="9" width="5" height="5" rx=".5"/><rect x="9" y="9" width="5" height="5" rx=".5"/></svg>
          </button>
          <button aria-label="List view">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="3" cy="4" r=".7" fill="currentColor"/><circle cx="3" cy="8" r=".7" fill="currentColor"/><circle cx="3" cy="12" r=".7" fill="currentColor"/><line x1="6" y1="4" x2="14" y2="4"/><line x1="6" y1="8" x2="14" y2="8"/><line x1="6" y1="12" x2="14" y2="12"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
